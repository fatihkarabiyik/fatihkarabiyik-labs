[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caesar-cipher"
version = "0.1.0"
description = "A simple Caesar cipher CLI and library."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
caesar-cipher = "caesar_cipher.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caesar_cipher"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
